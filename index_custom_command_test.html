<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakidash Custom Command Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: sans-serif;
        }

        #kakidash-container {
            width: 100%;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .rocket-launch-effect {
            position: fixed;
            top: 50%;
            left: -100px;
            font-size: 50px;
            z-index: 10000;
            transition: left 2s ease-in;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="kakidash-container"></div>
    <script type="module">
        import { Kakidash } from './src/index.ts';

        const container = document.getElementById('kakidash-container');
        const board = new Kakidash(container);

        // Register a custom command
        board.registerCommand({
            id: 'rocket-launch',
            topic: '🚀 Rocket Launch',
            execute: (selectedNodeId) => {
                console.log('Rocket launched! Selected Node:', selectedNodeId);
                const rocket = document.createElement('div');
                rocket.className = 'rocket-launch-effect';
                rocket.textContent = '🚀';
                document.body.appendChild(rocket);

                // Trigger animation
                setTimeout(() => {
                    rocket.style.left = '110vw';
                }, 100);

                // Cleanup
                setTimeout(() => {
                    rocket.remove();
                }, 2100);

                if (selectedNodeId) {
                    board.updateNodeTopic(selectedNodeId, '🚀 LAUNCHED!');
                }
            }
        });

        // Load some initial data
        board.loadData({
            root: {
                id: 'root',
                topic: 'Rocket Base',
                children: [
                    { id: 'node-1', topic: 'Select me and launch rocket!' }
                ]
            }
        });
    </script>
</body>

</html>
